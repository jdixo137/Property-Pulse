<h2>Property Listings </h2>
<form [formGroup]="propertyForm">
    <div>
        <label for="address">Address:</label>
        <input 
        id="address"
        type="text"
        formControlName="address">
    </div>
     <div>
        <label for="city">City:</label>
        <input 
        id="city"
        type="text"
        formControlName="city">
    </div>
     <div>
        <label for="state">State:</label>
        <input 
        id="state"
        type="text"
        formControlName="state">
    </div>
     <div>
        <label for="zip">Address:</label>
        <input 
        id="zip"
        type="text"
        formControlName="zip">
    </div>
     <div>
        <label for="property-type">Property Type:</label>
        <input 
        id="propety-type"
        type="text"
        formControlName="propertyType">
    </div>

     <div>
        <label for="rent-price">Rent Price:</label>
        <input 
        id="rent-price"
        type="text"
        formControlName="rentPrice">
    </div>
    <div>
        <label for="beds">Bedrooms:</label>
        <input 
        id="beds"
        type="text"
        formControlName="beds">
    </div>
    <div>
        <label for="baths">Bathrooms:</label>
        <input 
        id="baths"
        type="text"
        formControlName="baths">
    </div>
    <div>
        <label for="amentities">Popular Amentities:</label>
        <input 
        id="amentities"
        type="text"
        formControlName="amentities">
    </div>
    <div>
        <label for="landlord">Landlord:</label>
        <input 
        id="landlord"
        type="text"
        formControlName="landlord">
    </div>
    
</form>
