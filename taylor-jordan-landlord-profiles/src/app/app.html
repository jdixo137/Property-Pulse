<header class="app-header">
  <h1>Property Pulse</h1>
  <nav class="main-nav">
    <a routerLink="/properties" routerLinkActive="active">Property Listings</a>
    <a routerLink="/landlords" routerLinkActive="active">Landlord Profiles</a>
    <a routerLink="/reviews" routerLinkActive="active">Reviews</a>
  </nav>
</header>

<main class="container">
  @if (hasPropertyDraft) {
    <div class="draft-banner">
      <span>Your property form is saved. Add the landlord below, then go back to finish it.</span>
      <a routerLink="/properties" class="btn btn-primary">&larr; Back to Property</a>
    </div>
  }
  <router-outlet />
</main>
